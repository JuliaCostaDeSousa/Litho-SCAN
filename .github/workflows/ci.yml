name: CI
on:
  push:
    branches: [ main, develop, "feat/**", "fix/**", "chore/**" ]
    paths: [ "frontend/**", "backend/**", ".github/workflows/**" ]
  pull_request:
    branches: [ main, develop ]
    paths: [ "frontend/**", "backend/**", ".github/workflows/**" ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5000
          VITE_TAU: "0.75"
          VITE_DELTA: "0.02"
          VITE_USE_MOCK_PREDICT: "true"

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt || true
      - name: Syntax check
        run: python - <<'PY'
          import compileall, sys
          sys.exit(0 if compileall.compile_dir('.', force=True, quiet=1) else 1) 
          PY
