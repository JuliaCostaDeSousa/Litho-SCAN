<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preload" as="image" href="/ui/bg.png">
    <link rel="preload" as="image" href="/ui/frame-224.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React + TS</title>
  </head>
  <script>
    // Load a console overlay only when you add ?debug=1 to the URL
    if (location.search.includes('debug=1')) {
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/eruda';
      s.onload = function () { eruda.init(); };
      document.body.appendChild(s);

      // (optional) log fetch responses quickly
      const _fetch = window.fetch;
      window.fetch = async (...args) => {
        try {
          const res = await _fetch(...args);
          console.log('[fetch]', args[0], res.status, res.ok);
          return res;
        } catch (e) {
          console.error('[fetch error]', args[0], e);
          throw e;
        }
      };
    }
  </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
